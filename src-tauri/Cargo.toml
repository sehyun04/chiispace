[package]
name = "chiispace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "터미널을 한 칸으로 두는 작업환경"

[lib]
# Windows 에서 lib 이름이 bin 과 같으면 충돌한다(rust-lang/cargo#8519).
name = "chiispace_lib"
# staticlib·cdylib 은 Tauri 템플릿이 모바일용으로 넣어 둔 것이라 여기서는 쓰지
# 않는다. 데스크톱만 만들 것이므로 빼 두면 링크할 산출물이 하나로 준다.
crate-type = ["rlib"]

[features]
# Tauri 는 릴리스 여부를 --release 가 아니라 이 feature 로 가른다. 꺼져 있으면
# generate_context! 가 dev 모드로 컴파일되어 dist 를 박지 않고 devUrl(vite)을
# 본다 — release exe 인데 "localhost 연결을 거부했습니다"가 뜬다.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# PTY 바이트를 웹뷰로 보낼 때 JSON 문자열에 안전하게 싣기 위해. 부분 UTF-8
# 시퀀스가 청크 경계에 걸리면 문자열로는 깨지지만 base64 는 바이트를 그대로 나른다.
base64 = "0.22"

# 터미널 엔진. 여기 소스는 우리가 갖지 않는다 — upstream(2rami/kasaterm)의
# 크레이트를 그대로 당겨 쓴다. rev 를 박아 두는 이유: upstream main 은 활발히
# 움직이고, 엔진이 말없이 바뀌면 여기가 깨진다. 올릴 때는 의도적으로 올린다.
#
# GPU 셀 렌더러(kasa-cells)는 쓰지 않는다 — 화면은 웹뷰의 xterm.js 가 그린다.
kasa-pty = { git = "https://github.com/2rami/kasaterm", rev = "f77f46edfb8d954bf81df103bd320d2196fd267d" }

# 엔진을 같이 고쳐 가며 실험할 때만 주석을 푼다. git 대신 옆 폴더의 작업 트리를 쓴다.
# [patch."https://github.com/2rami/kasaterm"]
# kasa-pty = { path = "../../kasaterm/crates/kasa-pty" }
