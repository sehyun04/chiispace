[package]
name = "kasaspace"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "터미널을 한 칸으로 두는 작업환경. 터미널 엔진은 kasaterm 것을 그대로 쓰고, 그 위 배치·파일·git·에이전트 배선만 여기서 만든다."

[dependencies]
# 터미널 엔진 — 여기 소스는 우리가 갖지 않는다. PTY 생성·VT 파싱·셀 렌더러는
# 전부 upstream(2rami/kasaterm)의 크레이트를 그대로 당겨 쓴다. rev 를 박아 두는
# 이유: upstream main 은 활발히 움직이고, 엔진이 말없이 바뀌면 여기가 깨진다.
# 올릴 때는 의도적으로 올린다.
kasa-pty = { git = "https://github.com/2rami/kasaterm", rev = "06d68c947974f04b311c67648a9ff5d3857c3ff4" }
kasa-cells = { git = "https://github.com/2rami/kasaterm", rev = "06d68c947974f04b311c67648a9ff5d3857c3ff4" }
kasa-bridge = { git = "https://github.com/2rami/kasaterm", rev = "06d68c947974f04b311c67648a9ff5d3857c3ff4" }

anyhow = "1"
winit = "0.30"
wgpu = "28"
pollster = "0.4"
raw-window-handle = "0.6"

# 엔진을 고쳐 가며 실험할 때만 주석을 푼다. 이러면 git 대신 옆 폴더의
# 작업 트리를 쓴다 — 커밋·push 없이 즉시 반영된다.
# [patch."https://github.com/2rami/kasaterm"]
# kasa-pty = { path = "../kasaterm/crates/kasa-pty" }
# kasa-cells = { path = "../kasaterm/crates/kasa-cells" }
# kasa-bridge = { path = "../kasaterm/crates/kasa-bridge" }
